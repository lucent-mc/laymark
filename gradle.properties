# Single version property drives both published artifacts, so the runner embedded in the
# mod jar always matches its host by construction.
laymarkVersion=0.1.0-SNAPSHOT

# Read by the convention plugins in build-logic. Version-catalog accessors are not generated
# for precompiled script plugins, and the usual workaround (putting the catalog jar on
# build-logic's classpath by reflection) is fragile enough not to be worth it for two values.
# The catalog remains the source of truth for everything module build scripts consume.
javaVersion=25
junitVersion=5.14.0

org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
