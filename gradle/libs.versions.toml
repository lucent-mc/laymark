[versions]
# The exact target tuple. Every result records these; the runner refuses a mismatch.
java = "25"
minecraft = "26.1.2"
neoforge = "26.1.2.95"

# Instrumentation. Runtime artifacts are pinned by Modrinth version ID plus hash
# verification when they are materialised into an instance -- these coordinates are
# for compile-time APIs only, and are added in the slice that needs them.
spark = "1.10.173"
chunky = "1.5.4"

# spark-api carries no release version and has not been republished since 2025-07-03. It is
# nonetheless the published, supported surface -- everything that drives a capture lives in
# spark-common, which is shaded into the mod jar and deliberately not imported.
sparkApi = "0.1-SNAPSHOT"

junit = "5.14.0"

# Exactly the Gson that Minecraft 26.1.2 already ships (confirmed on the captured launch
# classpath). Chosen so the mod side adds *zero* classes to the measured process -- Gson is
# already there. The runner shades it, where footprint is irrelevant. Any other JSON library
# would mean bundling one into the process being benchmarked.
gson = "2.13.2"

# The runner's only third-party dependency beyond Gson, and it is a Swing look-and-feel: no
# toolkit, and nothing that could reach the measured process.
flatlaf = "3.6"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
spark-api = { module = "me.lucko:spark-api", version.ref = "sparkApi" }
# The whole mod jar off Modrinth's maven, compileOnly: Chunky publishes no separate API artifact,
# and the eight ChunkyAPI methods plus two event records are the documented, version()-gated
# surface (see docs/spark-chunky-control-surfaces-research.md).
chunky = { module = "maven.modrinth:chunky", version.ref = "chunky" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
moddev = { id = "net.neoforged.moddev", version = "2.0.144" }
